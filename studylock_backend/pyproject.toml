[project]
name = "studylock-backend"
version = "0.1.0"
description = "Backend for studylock app"
readme = "README.md"
authors = [
    { name = "Ashwath", email = "ashwath.palanisamy08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "gunicorn>=26.2.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
studylock-backend = "studylock_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
